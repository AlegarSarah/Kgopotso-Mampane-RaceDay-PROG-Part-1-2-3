name: Build RaceDay

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify required documentation exists
      run: |
        test -f docs/Database.sql && echo "Database.sql found"
        test -f docs/ERD.md && echo "ERD.md found"
        test -f docs/API.md && echo "API.md found"
        test -f README.md && echo "README.md found"
